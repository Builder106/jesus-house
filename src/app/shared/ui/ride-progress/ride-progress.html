@if (enabled()) {
  <div #rail class="jh-rail" [class.jh-rail--dark]="onDark()">
    <!-- the road: asphalt with a dashed centre line -->
    <span class="jh-rail__road" aria-hidden="true"></span>

    <!-- a stop line across the road for each section; its street sign shows
         on hover or focus, and choosing it drives there -->
    @if (stops().length) {
      <nav class="jh-rail__stops" aria-label="Sections on this page">
        @for (stop of stops(); track stop.label; let i = $index) {
          <button type="button" class="jh-rail__stop" [style.--f]="stop.at" (click)="driveTo(i)">
            <span class="jh-rail__sign">{{ stop.label }}</span>
          </button>
        }
      </nav>
    }

    <!-- the car, seen from above, driving down the page -->
    <span class="jh-rail__car" aria-hidden="true">
      <svg viewBox="0 0 24 40" width="18" height="30" xmlns="http://www.w3.org/2000/svg">
        <rect x="1" y="7" width="3" height="7" rx="1.2" fill="#221E3A" />
        <rect x="20" y="7" width="3" height="7" rx="1.2" fill="#221E3A" />
        <rect x="1" y="27" width="3" height="7" rx="1.2" fill="#221E3A" />
        <rect x="20" y="27" width="3" height="7" rx="1.2" fill="#221E3A" />
        <rect x="3" y="1" width="18" height="38" rx="6" fill="currentColor" />
        <path d="M6 9.5 Q12 7 18 9.5 L17 13 H7 Z" fill="#3A3354" />
        <rect x="7" y="13" width="10" height="11" rx="2" fill="#F05A4F" />
        <path d="M7 24 H17 L18.5 29.5 Q12 32 5.5 29.5 Z" fill="#3A3354" />
        <rect x="5.5" y="36" width="3.5" height="2" rx="1" fill="#FFE7A3" />
        <rect x="15" y="36" width="3.5" height="2" rx="1" fill="#FFE7A3" />
      </svg>
    </span>
  </div>
}
