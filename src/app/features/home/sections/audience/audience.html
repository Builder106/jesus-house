<!--
  SCENE 3 — A PLACE FOR YOU (audience).
  Inside now: a pew in morning light, the Bible from the car open on the red
  cushion. The camera move: scroll zooms INTO the picture on its left page,
  the stained-glass window the sanctuary scene opens with.

  Static baseline (SSR / no-JS / mobile / reduced-motion): a normal section —
  illustration behind, copy panel on top. jhScene adds the pin + camera only
  on desktop with motion allowed.
-->
<section class="scene__stage" aria-labelledby="audience-heading">
  <!-- The illustrated pew scene (decorative). -->
  <img
    class="scene__art"
    data-scene-var
    src="/art/audience-scene.webp"
    width="2880"
    height="1800"
    alt=""
    aria-hidden="true"
    loading="lazy"
    decoding="async"
  />

  <!-- Idle motion over the art while the scene rests; fades out before the
       dive (art-src/scenes/idle.py). -->
  <app-scene-idle scene="audience" class="scene__idle" data-scene-var />

  <!-- The camera's close-up: the picture of the stained-glass window on the
       Bible's open page. Fades in mid-dive and holds while the sanctuary
       rises over it. -->
  <img
    class="scene__close"
    data-scene-var
    src="/art/audience-close.webp"
    width="2880"
    height="1800"
    alt=""
    aria-hidden="true"
    loading="lazy"
    decoding="async"
  />

  <!-- Copy panel -->
  <div class="scene__copy relative z-[2] mx-auto w-full max-w-5xl px-6" data-scene-var>
    <div class="scene__panel max-w-xl rounded-lg border border-jh-rule p-8 sm:p-10">
      <p appReveal class="jh-script-eyebrow text-jh-gold-ink">Whoever you are</p>

      <h2
        id="audience-heading"
        appReveal="90"
        class="mt-3 max-w-2xl font-display text-3xl font-semibold leading-tight text-jh-ink sm:text-4xl"
      >
        There's a place for you here.
      </h2>

      <ul class="mt-8 flex flex-wrap gap-3" aria-label="People who are welcome at Jesus House">
        @for (audience of audiences; track audience; let i = $index) {
          <li
            [appReveal]="180 + i * 70"
            appRevealDir="up"
            class="rounded-full border border-jh-rule bg-jh-surface px-5 py-2.5 text-sm font-semibold text-jh-ink"
          >
            {{ audience }}
          </li>
        }
      </ul>

      <p appReveal="640" class="mt-8 max-w-xl text-lg leading-relaxed text-jh-soft">
        Wesleyan students, Middletown families, and everyone in between — you'll fit right in.
      </p>
    </div>
  </div>
  <!-- Idle motion that floats over the copy panel (leaves, dust, sparkles). -->
  <app-scene-idle scene="audience" layer="front" class="scene__idle" data-scene-var />
</section>
