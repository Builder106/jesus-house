<!--
  SCENE 3 — A PLACE FOR YOU (audience).
  Inside now: a pew in morning light, the Bible from the car open on the red
  cushion. The camera move: scroll zooms INTO the picture on its left page,
  the stained-glass window the sanctuary scene opens with.

  Static baseline (SSR / no-JS / short viewports / reduced motion): a normal
  section; the plaque and the place cards read over the illustration. jhScene
  adds the pin and camera when the viewport is tall enough.
-->
<section class="scene__stage" aria-labelledby="audience-heading">
  <!-- The illustrated pew scene (decorative). -->
  <img
    class="scene__art"
    data-scene-var
    src="/art/audience-scene.webp"
    width="2880"
    height="1800"
    alt=""
    aria-hidden="true"
    loading="lazy"
    decoding="async"
  />

  <!-- Idle motion over the art while the scene rests; fades out before the
       dive (art-src/scenes/idle.py). -->
  <app-scene-idle scene="audience" class="scene__idle" data-scene-var />

  <!-- The camera's close-up: the picture of the stained-glass window on the
       Bible's open page. Fades in mid-dive and holds while the sanctuary
       rises over it. -->
  <img
    class="scene__close"
    data-scene-var
    src="/art/audience-close.webp"
    width="2880"
    height="1800"
    alt=""
    aria-hidden="true"
    loading="lazy"
    decoding="async"
  />

  <!-- An engraved brass plaque on the wall carries the heading, and a place
       card stands on the cushion for each kind of visitor: the seat is saved
       for you. -->
  <div class="scene__copy" data-scene-var>
    <div class="plaque">
      <h2 id="audience-heading" appReveal class="plaque__title font-display">
        There's a place for you here.
      </h2>
      <p appReveal="90" class="plaque__text">
        Wesleyan students, Middletown families, and everyone in between: you'll fit right in.
      </p>
    </div>

    <ul class="cards" aria-label="People who are welcome at Jesus House">
      @for (audience of audiences; track audience; let i = $index) {
        <li [appReveal]="180 + i * 70" appRevealDir="up" class="card font-display">
          {{ audience }}
        </li>
      }
    </ul>
  </div>
  <!-- Idle motion that floats over the plaque and cards (dust in the light). -->
  <app-scene-idle scene="audience" layer="front" class="scene__idle" data-scene-var />
</section>
