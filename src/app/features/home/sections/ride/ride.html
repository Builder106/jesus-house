<!--
  SCENE 2 — THE ROAD TO US (ride ministry).
  A picture-book vignette: Sunday morning, the red car on the road to the
  meetinghouse. The camera move: scroll zooms INTO the car's rear window,
  onto the Bible on the back seat; the pew scene (the same book, open) rises
  over that close-up.

  Static baseline (SSR / no-JS / short viewports / reduced motion): a normal
  section; the illustration fills the band and the sign stands centred over
  it. jhScene adds the pin and camera when the viewport is tall enough.
-->
<section class="scene__stage" aria-labelledby="ride-heading">
  <!-- The illustrated road scene (decorative; copy carries the content). -->
  <img
    class="scene__art"
    data-scene-var
    src="/art/ride-scene.webp"
    width="2880"
    height="1800"
    alt=""
    aria-hidden="true"
    loading="lazy"
    decoding="async"
  />

  <!-- Idle motion over the art while the scene rests; fades out before the
       dive (art-src/scenes/idle.py). -->
  <app-scene-idle scene="ride" class="scene__idle" data-scene-var />

  <!-- The camera's close-up: a sharp crop of the same art around the rear
       window (the Bible on the back seat). Fades in mid-dive and holds while
       the pew scene rises over it. Hidden unless the scene is active. -->
  <img
    class="scene__close"
    data-scene-var
    src="/art/ride-close.webp"
    width="2880"
    height="1800"
    alt=""
    aria-hidden="true"
    loading="lazy"
    decoding="async"
  />

  <!-- The church's roadside sign carries the copy, the ride links, and the
       pickup spots; on wide screens it stands on the verge by the maple. -->
  <div class="scene__copy" data-scene-var>
    <app-roadside-sign class="scene__sign" />
  </div>
  <!-- Idle motion that floats over the sign (leaves on the wind). -->
  <app-scene-idle scene="ride" layer="front" class="scene__idle" data-scene-var />
</section>
