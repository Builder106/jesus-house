<!--
  SCENE 4 — SUNDAY MORNING (values).
  The sanctuary: the chancel, the pastor, an usher in the aisle, a full
  congregation, and the great stained-glass arch. The four Sunday beats
  (Welcoming, Rooted, Together, Sending) are printed as the order of service
  on a bulletin resting on the front pew. While the scene is pinned,
  scrolling moves the bulletin down its four items, and the people in the
  room act out the item it is on (app-scene-idle, keyed by [beat]): the usher
  offers a bulletin as a newcomer walks in, the pastor preaches, hands go up
  in worship, two people turn round in their pews to wave. Then the camera
  zooms INTO the cross in the stained glass and its deep indigo becomes the
  ground of the cathedral section that follows.

  Static baseline (SSR / no-JS / short viewports / reduced motion): a normal
  section; the scene illustrates and the bulletin reads over it with all four
  items, none marked.
-->
<section class="scene__stage" data-jh-header-dark="when-veiled" aria-labelledby="values-heading">
  <!-- The illustrated sanctuary and its people at rest (decorative). -->
  <img
    class="scene__art"
    data-scene-var
    src="/art/values-scene.webp"
    width="2880"
    height="1800"
    alt=""
    aria-hidden="true"
    loading="lazy"
    decoding="async"
  />

  <!-- Idle motion over the art while the scene rests, including the people
       acting out the bulletin's current item; fades out before the dive
       (art-src/scenes/idle.py). -->
  <app-scene-idle scene="values" class="scene__idle" data-scene-var [beat]="activeIndex()" />

  <!-- The camera's close-up: the cross in the great window, its deep navy
       glass. Fades in mid-dive and holds while the cathedral section rises
       over it; it is also the dark ground the header watches for. -->
  <img
    class="scene__close"
    data-scene-var
    data-jh-header-dark-veil
    src="/art/values-close.webp"
    width="2880"
    height="1800"
    alt=""
    aria-hidden="true"
    loading="lazy"
    decoding="async"
  />

  <div class="scene__copy" data-scene-var>
    <!-- The order of service. The item the scroll is on catches the coloured
         light from the window; on narrow or short screens only that item
         opens to its full line. -->
    <article class="bulletin">
      <h2 id="values-heading" appReveal class="bulletin__title font-display">
        What Sunday is like
      </h2>
      <p appReveal="80" class="bulletin__lede">
        Four things you can count on the moment you walk through our doors.
      </p>
      <ol class="bulletin__order" aria-label="Order of service">
        @for (beat of beats; track beat.word; let i = $index) {
          <li
            class="bulletin__item"
            [class.bulletin__item--now]="activeIndex() === i"
            [attr.aria-current]="activeIndex() === i ? 'step' : null"
          >
            <span class="bulletin__num font-display" aria-hidden="true">{{ beat.index }}</span>
            <div class="bulletin__head">
              <h3 class="bulletin__word font-display">{{ beat.word }}</h3>
              <span class="bulletin__leader" aria-hidden="true"></span>
              <span class="bulletin__label">{{ beat.label }}</span>
            </div>
            <div class="bulletin__more">
              <p>{{ beat.line }}</p>
            </div>
          </li>
        }
      </ol>
      <p class="bulletin__foot">Sunday Service | 9:00 AM | 120 Washington Street</p>
    </article>
  </div>
  <!-- Idle motion that floats over the bulletin (dust and sparkles). -->
  <app-scene-idle scene="values" layer="front" class="scene__idle" data-scene-var />
</section>
